name: networkmanager
on:
  push:
    branches: [main, sdm845-odin]
    paths: ['networkmanager/**', 'oci/**', 'scripts/**', 'toolchain.env', '.forgejo/workflows/networkmanager.yml', '.forgejo/workflows/_package-image.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    uses: ./.forgejo/workflows/_package-image.yml
    secrets: inherit
    with:
      package: networkmanager
