name: jupiter-hw-support
on:
  push:
    branches: [main, sdm845-odin]
    paths: ['jupiter-hw-support/**', 'oci/**', 'scripts/**', 'toolchain.env', '.forgejo/workflows/jupiter-hw-support.yml', '.forgejo/workflows/_package-image.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    uses: ./.forgejo/workflows/_package-image.yml
    secrets: inherit
    with:
      package: jupiter-hw-support
